[package]
name = "dynastes"
version = "0.1.0"
edition = "2021"
authors = ["Juniper Parsons"]
exclude = ["assets/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.15.0" }
ron = { version = "0.8.0" }
serde = { version = "1.0", features = ['derive'] }
thiserror = "2.0.11"

[dev-dependencies]
env_logger = "0.10.0"

[features]
default = []

[lib]
crate-type = ["rlib"]
edition = "2021"

[[example]]
name = "animation"
